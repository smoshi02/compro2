<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<th:block th:fragment="menuItem(url, label, class, activeMenu)">
    <li th:attr="data-url=${url}" th:classappend="${class} + (${activeMenu == class ? ' active' : ''})">
        <svg th:switch="${class}" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Dashboard -->
            <g th:case="'dashboard'">
                <path d="M3 13h8V3H3v10zM3 21h8v-6H3v6zM13 21h8v-10h-8v10zM13 3v6h8V3h-8z"
                      stroke="#9197B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- Catalog -->
            <g th:case="'catalog'">
                <path d="M4 6H20M4 12H20M4 18H20"
                      stroke="#9197B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- Add -->
            <g th:case="'add'">
                <path d="M12 5v14M5 12h14"
                      stroke="#9197B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- Logout -->
            <g th:case="'logout'">
                <path d="M16 17l5-5-5-5M21 12H9M13 3h-2a5 5 0 00-5 5v8a5 5 0 005 5h2"
                      stroke="#9197B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- Fallback Icon -->
            <g th:case="*">
                <circle cx="12" cy="12" r="10"
                        stroke="#9197B3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </svg>

        <span th:text="${label}"></span>
        <span>></span>
    </li>
</th:block>
